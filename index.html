<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Universe Flythrough — MIDI Visuals</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    font-family: -apple-system, sans-serif; color: #eee;
    background: rgba(0,0,0,0.5); padding: 10px 14px; border-radius: 8px;
  }
  #ui select, #ui button {
    font-size: 14px; padding: 4px 8px; margin-left: 6px; border-radius: 4px; border: none;
  }
  #status { margin-top: 6px; font-size: 12px; opacity: 0.8; }
  #vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.55) 100%);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/",
    "lil-gui": "https://unpkg.com/lil-gui@0.19/dist/lil-gui.esm.js",
    "simplex-noise": "https://esm.sh/simplex-noise@4.0.3"
  }
}
</script>
</head>
<body>

<div id="ui">
  <button id="startBtn">Enable MIDI</button>
  <select id="deviceSelect" style="display:none;"></select>
  <div id="status">Click "Enable MIDI" to begin.</div>
</div>

<div id="vignette"></div>

<script type="module" src="main.js?v=26"></script>
</body>
</html>
